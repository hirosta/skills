<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>こもれび架空教室の体験案内（点検前）</title>
  <link rel="stylesheet" href="before.css">
</head>
<body>
  <main>
    <h1>こもれび架空教室</h1>
    <p>これは点検用の架空の案内です。実際の募集や送信は行いません。</p>
    <p class="intro">紙で小さな家を作る体験会です。道具は教室で用意します。</p>
    <p class="small">対象は初めて参加する方です。</p>
    <p class="rem-small">材料費は架空の設定で300円です。</p>
    <p class="text-xs leading-tight">作品は持ち帰れます。机を囲んで作業します。</p>
    <p class="text-[12px] italic">当日は紙の作品を展示します。</p>
    <p class="note">はさみは会場で貸し出します。</p>
    <p><a class="no-underline" href="#details">詳しくはこちら</a></p>
    <section id="details">
      <h2>参加内容の記入例</h2>
      <div class="field">
        <input type="text" placeholder="作品名（20文字まで）" class="focus:outline-none">
        <p class="error">エラーです。</p>
      </div>
      <button type="button" class="primary">確認する（動作しない例）</button>
      <button type="button" class="primary" disabled>送信する（動作しない例）</button>
    </section>
  </main>
</body>
</html>
