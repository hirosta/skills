<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>こもれび架空教室の体験案内（点検後）</title>
  <link rel="stylesheet" href="after.css">
</head>
<body>
  <main>
    <h1>こもれび架空教室</h1>
    <p>これは点検用の架空の案内です。実際の募集や送信は行いません。</p>
    <p>紙で小さな家を作る体験会です。道具は教室で用意します。</p>
    <p>対象は初めて参加する方です。</p>
    <p>材料費は架空の設定で300円です。</p>
    <p>作品は持ち帰れます。机を囲んで作業します。</p>
    <p>当日は紙の作品を展示します。</p>
    <p>はさみは会場で貸し出します。</p>
    <p><a href="#details">参加内容の記入例を見る</a></p>
    <section id="details" aria-labelledby="details-title">
      <h2 id="details-title">参加内容の記入例</h2>
      <div class="field">
        <label for="work-title">作品名 <span>※必須</span></label>
        <p id="work-hint">作品に付けたい名前を20文字以内で入力してください。</p>
        <input id="work-title" type="text" required maxlength="20"
               aria-describedby="work-hint work-error" aria-invalid="true">
        <p id="work-error" class="error">＊作品名が空欄です。20文字以内で作品名を入力してください。（エラー表示の見本）</p>
      </div>
      <p>次のボタンは表示の見本です。押しても送信されません。</p>
      <button type="button" class="primary">確認する（動作しない例）</button>
    </section>
  </main>
</body>
</html>
